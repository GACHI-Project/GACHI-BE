spring:
  application:
    name: GACHI-BE
  profiles:
    default: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000ms}
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    consent-version: ${AUTH_CONSENT_VERSION:2026-04-v1}
    jwt:
      issuer: ${JWT_ISSUER:gachi-be}
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
      refresh-token-remember-days: ${JWT_REFRESH_TOKEN_REMEMBER_DAYS:30}
    email:
      store: ${AUTH_EMAIL_STORE:redis}
      code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS:300}
      resend-cooldown-seconds: ${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${AUTH_EMAIL_MAX_ATTEMPTS:5}
      verified-ttl-seconds: ${AUTH_EMAIL_VERIFIED_TTL_SECONDS:1800}
      from-address: ${AUTH_EMAIL_FROM_ADDRESS:}
      reply-to: ${AUTH_EMAIL_REPLY_TO:}
      noop-allowed: ${AUTH_EMAIL_NOOP_ALLOWED:false}
      subject: ${AUTH_EMAIL_SUBJECT:[GACHI] Email verification code}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      key-prefix: ${AUTH_RATE_LIMIT_KEY_PREFIX:auth:rate-limit:}
      email-hmac-secret: ${AUTH_RATE_LIMIT_EMAIL_HMAC_SECRET:}
      trusted-proxies: ${AUTH_RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}
      email-send:
        limit: ${AUTH_RATE_LIMIT_EMAIL_SEND_LIMIT:3}
        window-seconds: ${AUTH_RATE_LIMIT_EMAIL_SEND_WINDOW_SECONDS:300}
      login:
        limit: ${AUTH_RATE_LIMIT_LOGIN_LIMIT:5}
        window-seconds: ${AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    image-prefix: ${AWS_S3_IMAGE_PREFIX:images}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  clova:
    ocr:
      invoke-url: ${CLOVA_OCR_API_URL:}
      secret-key: ${CLOVA_OCR_SECRET_KEY:}
      presigned-url-minutes: ${CLOVA_OCR_PRESIGNED_MINUTES:15}
    papago:
      client-id: ${PAPAGO_CLIENT_ID:}
      client-secret: ${PAPAGO_CLIENT_SECRET:}
      api-url: https://papago.apigw.ntruss.com/nmt/v1
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    connect-timeout-seconds: ${AI_SERVER_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${AI_SERVER_READ_TIMEOUT_SECONDS:120}
  neis:
    api-key: ${NEIS_API_KEY:}
    school-api-key: ${NEIS_SCHOOL_API_KEY:${NEIS_API_KEY:}}
    schedule-api-key: ${NEIS_SCHEDULE_API_KEY:${NEIS_API_KEY:}}
    school-info-url: ${NEIS_SCHOOL_INFO_URL:https://open.neis.go.kr/hub/schoolInfo}
    school-schedule-url: ${NEIS_SCHOOL_SCHEDULE_URL:https://open.neis.go.kr/hub/SchoolSchedule}
    connect-timeout-seconds: ${NEIS_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${NEIS_READ_TIMEOUT_SECONDS:10}
  notification:
    push:
      enabled: ${NOTIFICATION_PUSH_ENABLED:false}
      provider: ${NOTIFICATION_PUSH_PROVIDER:expo}
      connect-timeout-seconds: ${NOTIFICATION_PUSH_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${NOTIFICATION_PUSH_READ_TIMEOUT_SECONDS:10}
      expo:
        api-url: ${EXPO_PUSH_API_URL:https://exp.host/--/api/v2/push/send}
        access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
