name: Deploy to EC2

"on":
  workflow_run:
    workflows: ["BE Docker CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2-ssm
      cancel-in-progress: false
    env:
      SSM_EXECUTION_TIMEOUT_SECONDS: "3600"
      SSM_POLL_INTERVAL_SECONDS: "10"
    steps:
      - name: Resolve deployment commit
        id: deploy-commit
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployment commit: $SOURCE_SHA"
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check automatic deployment commit is current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.deploy-commit.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$SOURCE_SHA" != "$CURRENT_MAIN_SHA" ]; then
              echo "::notice::Skipping stale CI commit $SOURCE_SHA; main is $CURRENT_MAIN_SHA."
              echo "current=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.freshness.outputs.current == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.deploy-commit.outputs.sha }}

      - name: Verify deployment script supports commit image tags
        if: ${{ steps.freshness.outputs.current == 'true' }}
        run: |
          if [ "$(bash scripts/deploy-ec2.sh --capability)" != "backend-image-tag-v1" ]; then
            echo "::error::Deployment script at the target commit does not support commit image tags."
            exit 1
          fi

      - name: Resolve deploy path
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: deploy-path
        env:
          EC2_DEPLOY_PATH_SECRET: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          RESOLVED_PATH="${EC2_DEPLOY_PATH_SECRET:-}"
          RESOLVED_PATH="${RESOLVED_PATH%$'\r'}"
          RESOLVED_PATH="$(printf '%s' "$RESOLVED_PATH" | sed 's/[[:space:]]*$//')"
          if [ -n "$RESOLVED_PATH" ]; then
            echo "value=$RESOLVED_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "value=/home/ubuntu/GACHI-BE/deploy" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve AWS region
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: aws-region
        env:
          AWS_REGION_SECRET: ${{ secrets.AWS_REGION }}
        run: |
          RESOLVED_REGION="${AWS_REGION_SECRET:-}"
          RESOLVED_REGION="${RESOLVED_REGION%$'\r'}"
          RESOLVED_REGION="$(printf '%s' "$RESOLVED_REGION" | sed 's/[[:space:]]*$//')"
          if [ -n "$RESOLVED_REGION" ]; then
            echo "value=$RESOLVED_REGION" >> "$GITHUB_OUTPUT"
          else
            echo "value=ap-northeast-2" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve EC2 host fallback
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: ec2-host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          RESOLVED_HOST="${EC2_HOST:-}"
          RESOLVED_HOST="${RESOLVED_HOST%$'\r'}"
          RESOLVED_HOST="$(printf '%s' "$RESOLVED_HOST" | sed 's/[[:space:]]*$//')"
          echo "value=$RESOLVED_HOST" >> "$GITHUB_OUTPUT"

      - name: Resolve DockerHub token parameter
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: dockerhub-token-parameter
        env:
          DOCKERHUB_TOKEN_PARAMETER_NAME_SECRET: ${{ secrets.DOCKERHUB_TOKEN_PARAMETER_NAME }}
        run: |
          VALUE="${DOCKERHUB_TOKEN_PARAMETER_NAME_SECRET:-}"
          VALUE="${VALUE%$'\r'}"
          VALUE="$(printf '%s' "$VALUE" | sed 's/[[:space:]]*$//')"
          if [ -n "$VALUE" ]; then
            echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          else
            echo "value=/gachi/prod/dockerhub/token" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Kakao secret parameters
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: kakao-secret-parameters
        env:
          KAKAO_CLIENT_SECRET_PARAMETER_NAME_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET_PARAMETER_NAME }}
          KAKAO_ADMIN_KEY_PARAMETER_NAME_SECRET: ${{ secrets.KAKAO_ADMIN_KEY_PARAMETER_NAME }}
        run: |
          CLIENT_SECRET_PARAMETER="${KAKAO_CLIENT_SECRET_PARAMETER_NAME_SECRET:-/gachi/prod/kakao/client-secret}"
          ADMIN_KEY_PARAMETER="${KAKAO_ADMIN_KEY_PARAMETER_NAME_SECRET:-/gachi/prod/kakao/admin-key}"
          CLIENT_SECRET_PARAMETER="${CLIENT_SECRET_PARAMETER%$'\r'}"
          ADMIN_KEY_PARAMETER="${ADMIN_KEY_PARAMETER%$'\r'}"
          CLIENT_SECRET_PARAMETER="$(printf '%s' "$CLIENT_SECRET_PARAMETER" | sed 's/[[:space:]]*$//')"
          ADMIN_KEY_PARAMETER="$(printf '%s' "$ADMIN_KEY_PARAMETER" | sed 's/[[:space:]]*$//')"
          echo "client-secret=$CLIENT_SECRET_PARAMETER" >> "$GITHUB_OUTPUT"
          echo "admin-key=$ADMIN_KEY_PARAMETER" >> "$GITHUB_OUTPUT"

      - name: Validate SSM inputs
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: auth-check
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail
          if [ -z "${EC2_INSTANCE_ID:-}" ]; then
            echo "::error::EC2_INSTANCE_ID secret is required."
            exit 1
          fi
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME is required."
            exit 1
          fi
          if [ -n "${AWS_OIDC_ROLE_ARN:-}" ]; then
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
            echo "has_session_token=false" >> "$GITHUB_OUTPUT"
          else
            if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "::error::Set AWS_OIDC_ROLE_ARN or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
              exit 1
            fi
            echo "auth_mode=access_key" >> "$GITHUB_OUTPUT"
            if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
              echo "has_session_token=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_session_token=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.freshness.outputs.current == 'true' && steps.auth-check.outputs.auth_mode == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ steps.aws-region.outputs.value }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: gachi-be-deploy-ssm

      - name: Configure AWS credentials (Access key fallback)
        if: ${{ steps.freshness.outputs.current == 'true' && steps.auth-check.outputs.auth_mode == 'access_key' && steps.auth-check.outputs.has_session_token == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ steps.aws-region.outputs.value }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure AWS credentials (Access key fallback without session token)
        if: ${{ steps.freshness.outputs.current == 'true' && steps.auth-check.outputs.auth_mode == 'access_key' && steps.auth-check.outputs.has_session_token != 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ steps.aws-region.outputs.value }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Create production deployment
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.deploy-commit.outputs.sha }}
        run: |
          DEPLOYMENT_ID="$(jq -nc --arg ref "$SOURCE_SHA" \
            '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [], description: "Deploy GACHI-BE to EC2"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')"
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          jq -nc --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "in_progress", log_url: $log_url, description: "EC2 deployment in progress"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - >/dev/null

      - name: Build and send deploy command via SSM
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: ssm-send
        env:
          AWS_REGION: ${{ steps.aws-region.outputs.value }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_DEPLOY_PATH: ${{ steps.deploy-path.outputs.value }}
          EC2_HOST: ${{ steps.ec2-host.outputs.value }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BACKEND_IMAGE_TAG: ${{ steps.deploy-commit.outputs.image_tag }}
          DOCKERHUB_TOKEN_PARAMETER_NAME: ${{ steps.dockerhub-token-parameter.outputs.value }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET_PARAMETER_NAME: ${{ steps.kakao-secret-parameters.outputs.client-secret }}
          KAKAO_ADMIN_KEY_PARAMETER_NAME: ${{ steps.kakao-secret-parameters.outputs.admin-key }}
          KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_APP_REDIRECT_URI: ${{ secrets.KAKAO_APP_REDIRECT_URI }}
          GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED || 'false' }}
          GOOGLE_OAUTH_CLIENT_IDS: ${{ secrets.GOOGLE_OAUTH_CLIENT_IDS }}
        run: |
          set -Eeuo pipefail
          for value in \
            "$KAKAO_REST_API_KEY" \
            "$KAKAO_CLIENT_SECRET_PARAMETER_NAME" \
            "$KAKAO_ADMIN_KEY_PARAMETER_NAME" \
            "$KAKAO_APP_ID" \
            "$KAKAO_REDIRECT_URI" \
            "$KAKAO_APP_REDIRECT_URI"; do
            if [ -z "$value" ]; then
              echo "::error::All Kakao OAuth Actions secrets must be configured."
              exit 1
            fi
          done
          if [ "$GOOGLE_AUTH_ENABLED" = "true" ] && [ -z "$GOOGLE_OAUTH_CLIENT_IDS" ]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_IDS must be configured when Google OAuth is enabled."
            exit 1
          fi
          SCRIPT_PATH="scripts/deploy-ec2.sh"
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::$SCRIPT_PATH not found."
            exit 1
          fi

          DEPLOY_BUNDLE_PATH="$RUNNER_TEMP/deploy-sync.tgz"
          tar -czf "$DEPLOY_BUNDLE_PATH" \
            deploy/docker-compose.yml \
            deploy/.env.example \
            deploy/HTTPS-SETUP.md \
            deploy/nginx \
            deploy/secrets/spring_mail_password.example.txt \
            deploy/secrets/swagger_htpasswd.example.txt

          SCRIPT_BASE64="$(base64 -w 0 "$SCRIPT_PATH")"
          BUNDLE_BASE64="$(base64 -w 0 "$DEPLOY_BUNDLE_PATH")"
          # CHUNK_SIZE and payload guard must be tuned together.
          # Keep each command item reasonably small to avoid SSM request size limits.
          CHUNK_SIZE=3000
          TMP_PREFIX="/tmp/deploy-ec2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          REMOTE_SCRIPT_B64_PATH="${TMP_PREFIX}.sh.b64"
          REMOTE_BUNDLE_B64_PATH="${TMP_PREFIX}.tgz.b64"
          REMOTE_SCRIPT_PATH="${TMP_PREFIX}.sh"
          REMOTE_BUNDLE_PATH="${TMP_PREFIX}.tgz"

          COMMANDS_JSON="$(jq -cn \
            --arg remoteScriptB64Path "$REMOTE_SCRIPT_B64_PATH" \
            --arg remoteBundleB64Path "$REMOTE_BUNDLE_B64_PATH" \
            --arg remoteScriptPath "$REMOTE_SCRIPT_PATH" \
            --arg remoteBundlePath "$REMOTE_BUNDLE_PATH" \
            '[
              "rm -f " + ($remoteScriptB64Path | @sh) + " " + ($remoteBundleB64Path | @sh) + " " + ($remoteScriptPath | @sh) + " " + ($remoteBundlePath | @sh)
            ]')"

          for ((i=0; i<${#SCRIPT_BASE64}; i+=CHUNK_SIZE)); do
            CHUNK="${SCRIPT_BASE64:i:CHUNK_SIZE}"
            COMMANDS_JSON="$(printf '%s' "$COMMANDS_JSON" | jq -c \
              --arg chunk "$CHUNK" \
              --arg remoteScriptB64Path "$REMOTE_SCRIPT_B64_PATH" \
              '. + [("printf %s " + ($chunk | @sh) + " >> " + ($remoteScriptB64Path | @sh))]')"
          done

          for ((i=0; i<${#BUNDLE_BASE64}; i+=CHUNK_SIZE)); do
            CHUNK="${BUNDLE_BASE64:i:CHUNK_SIZE}"
            COMMANDS_JSON="$(printf '%s' "$COMMANDS_JSON" | jq -c \
              --arg chunk "$CHUNK" \
              --arg remoteBundleB64Path "$REMOTE_BUNDLE_B64_PATH" \
              '. + [("printf %s " + ($chunk | @sh) + " >> " + ($remoteBundleB64Path | @sh))]')"
          done

          COMMANDS_JSON="$(printf '%s' "$COMMANDS_JSON" | jq -c \
            --arg awsRegion "$AWS_REGION" \
            --arg deployPath "$EC2_DEPLOY_PATH" \
            --arg ec2Host "$EC2_HOST" \
            --arg dockerhubUsername "$DOCKERHUB_USERNAME" \
            --arg backendImageTag "$BACKEND_IMAGE_TAG" \
            --arg dockerhubTokenParameterName "$DOCKERHUB_TOKEN_PARAMETER_NAME" \
            --arg kakaoRestApiKey "$KAKAO_REST_API_KEY" \
            --arg kakaoClientSecretParameterName "$KAKAO_CLIENT_SECRET_PARAMETER_NAME" \
            --arg kakaoAdminKeyParameterName "$KAKAO_ADMIN_KEY_PARAMETER_NAME" \
            --arg kakaoAppId "$KAKAO_APP_ID" \
            --arg kakaoRedirectUri "$KAKAO_REDIRECT_URI" \
            --arg kakaoAppRedirectUri "$KAKAO_APP_REDIRECT_URI" \
            --arg googleAuthEnabled "$GOOGLE_AUTH_ENABLED" \
            --arg googleOauthClientIds "$GOOGLE_OAUTH_CLIENT_IDS" \
            --arg remoteScriptB64Path "$REMOTE_SCRIPT_B64_PATH" \
            --arg remoteBundleB64Path "$REMOTE_BUNDLE_B64_PATH" \
            --arg remoteScriptPath "$REMOTE_SCRIPT_PATH" \
            --arg remoteBundlePath "$REMOTE_BUNDLE_PATH" \
            '. + [
              (
                "base64 -d " + ($remoteScriptB64Path | @sh) + " > " + ($remoteScriptPath | @sh) +
                " && chmod 700 " + ($remoteScriptPath | @sh) +
                " && base64 -d " + ($remoteBundleB64Path | @sh) + " > " + ($remoteBundlePath | @sh) +
                " && mkdir -p " + ($deployPath | @sh) +
                " && tar -xzf " + ($remoteBundlePath | @sh) + " -C " + ($deployPath | @sh) + " --strip-components=1" +
                " && if command -v aws >/dev/null 2>&1; then DOCKERHUB_TOKEN=\"$(aws ssm get-parameter --region " + ($awsRegion | @sh) + " --name " + ($dockerhubTokenParameterName | @sh) + " --with-decryption --query Parameter.Value --output text 2>/dev/null || true)\"; else DOCKERHUB_TOKEN=\"\"; fi" +
                " && if [ -z \"$DOCKERHUB_TOKEN\" ]; then echo \"[warn] DOCKERHUB_TOKEN parameter load skipped or failed. deploy script will try current daemon credentials.\"; fi" +
                " && AWS_REGION=" + ($awsRegion | @sh) + " KAKAO_AUTH_ENABLED=true KAKAO_REST_API_KEY=" + ($kakaoRestApiKey | @sh) + " KAKAO_CLIENT_SECRET_PARAMETER_NAME=" + ($kakaoClientSecretParameterName | @sh) + " KAKAO_ADMIN_KEY_PARAMETER_NAME=" + ($kakaoAdminKeyParameterName | @sh) + " KAKAO_APP_ID=" + ($kakaoAppId | @sh) + " KAKAO_REDIRECT_URI=" + ($kakaoRedirectUri | @sh) + " KAKAO_APP_REDIRECT_URI=" + ($kakaoAppRedirectUri | @sh) + " GOOGLE_AUTH_ENABLED=" + ($googleAuthEnabled | @sh) + " GOOGLE_OAUTH_CLIENT_IDS=" + ($googleOauthClientIds | @sh) + " DOCKERHUB_USERNAME=" + ($dockerhubUsername | @sh) + " BACKEND_IMAGE_TAG=" + ($backendImageTag | @sh) + " DOCKERHUB_TOKEN=\"$DOCKERHUB_TOKEN\" bash " + ($remoteScriptPath | @sh) + " " + ($deployPath | @sh) + " " + ($ec2Host | @sh) +
                "; status=$?; rm -f " + ($remoteScriptB64Path | @sh) + " " + ($remoteBundleB64Path | @sh) + " " + ($remoteScriptPath | @sh) + " " + ($remoteBundlePath | @sh) + "; exit $status"
              )
            ]')"

          SSM_PARAMETERS="$(jq -cn \
            --argjson commands "$COMMANDS_JSON" \
            --arg executionTimeout "$SSM_EXECUTION_TIMEOUT_SECONDS" \
            '{commands: $commands, executionTimeout: [$executionTimeout]}')"

          PARAM_BYTES="$(printf '%s' "$SSM_PARAMETERS" | wc -c | tr -d ' ')"
          COMMAND_COUNT="$(printf '%s' "$COMMANDS_JSON" | jq -r 'length')"
          # SSM SendCommand request body limit is around 1MB.
          # 900000B leaves safety margin for JSON escaping/overhead.
          if [ "$PARAM_BYTES" -gt 900000 ]; then
            echo "::error::SSM parameters payload too large (${PARAM_BYTES} bytes, commands=${COMMAND_COUNT}). Use smaller deploy bundle or switch to S3 artifact delivery."
            exit 1
          fi

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "deploy-ec2 (run=${GITHUB_RUN_ID})" \
            --max-concurrency "1" \
            --max-errors "0" \
            --parameters "$SSM_PARAMETERS" \
            --query "Command.CommandId" \
            --output text)"

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "::error::Failed to create SSM command."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command created: $COMMAND_ID"

      - name: Wait for SSM command completion
        if: ${{ steps.freshness.outputs.current == 'true' }}
        env:
          AWS_REGION: ${{ steps.aws-region.outputs.value }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm-send.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          MAX_ATTEMPTS=$(( (SSM_EXECUTION_TIMEOUT_SECONDS + SSM_POLL_INTERVAL_SECONDS - 1) / SSM_POLL_INTERVAL_SECONDS ))
          STATUS=""
          TERMINAL_REACHED="false"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)"
            if [ -z "$STATUS" ]; then
              echo "[$attempt/$MAX_ATTEMPTS] status: not-ready"
            else
              echo "[$attempt/$MAX_ATTEMPTS] status: $STATUS"
            fi

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                TERMINAL_REACHED="true"
                break
                ;;
              *)
                sleep "$SSM_POLL_INTERVAL_SECONDS"
                ;;
            esac
          done

          INVOCATION_JSON="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json)"

          FINAL_STATUS="$(printf '%s' "$INVOCATION_JSON" | jq -r '.Status // "Unknown"')"
          RESPONSE_CODE="$(printf '%s' "$INVOCATION_JSON" | jq -r '.ResponseCode // -1')"
          STDERR_CONTENT="$(printf '%s' "$INVOCATION_JSON" | jq -r '.StandardErrorContent // ""')"
          STDOUT_CONTENT="$(printf '%s' "$INVOCATION_JSON" | jq -r '.StandardOutputContent // ""')"
          STDOUT_LENGTH="${#STDOUT_CONTENT}"
          STDERR_LENGTH="${#STDERR_CONTENT}"

          echo "::group::SSM stdout"
          printf '%s\n' "$STDOUT_CONTENT"
          echo "::endgroup::"

          if [ -n "$STDERR_CONTENT" ]; then
            echo "::group::SSM stderr"
            printf '%s\n' "$STDERR_CONTENT"
            echo "::endgroup::"
          fi

          if [ "$STDOUT_LENGTH" -ge 24000 ] || [ "$STDERR_LENGTH" -ge 24000 ]; then
            echo "::warning::SSM stdout/stderr may be truncated at 24000 characters. For full logs, check EC2 directly or enable S3/CloudWatch output for Run Command."
          fi

          if [ "$TERMINAL_REACHED" != "true" ] && [ "$FINAL_STATUS" != "Success" ] && [ "$FINAL_STATUS" != "Failed" ] && [ "$FINAL_STATUS" != "TimedOut" ] && [ "$FINAL_STATUS" != "Cancelled" ] && [ "$FINAL_STATUS" != "Cancelling" ]; then
            echo "::error::Polling timed out before terminal SSM status. finalStatus=$FINAL_STATUS"
            exit 1
          fi

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "::error::SSM command failed. status=$FINAL_STATUS responseCode=$RESPONSE_CODE"
            exit 1
          fi

      - name: Finalize production deployment
        if: ${{ always() && steps.deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          AWS_REGION: ${{ steps.aws-region.outputs.value }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm-send.outputs.command_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="EC2 deployment and backend health check succeeded"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            SSM_STATUS=""
            if [ -n "$COMMAND_ID" ]; then
              for attempt in $(seq 1 24); do
                SSM_STATUS="$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query Status --output text 2>/dev/null || true)"
                case "$SSM_STATUS" in
                  Success|Failed|TimedOut|Cancelled)
                    break
                    ;;
                esac
                sleep 5
              done
            fi
            case "$SSM_STATUS" in
              Success)
                STATE=success
                DESCRIPTION="EC2 deployment completed after Actions cancellation"
                ;;
              Failed|TimedOut|Cancelled)
                STATE=failure
                DESCRIPTION="SSM command ended with $SSM_STATUS after Actions cancellation"
                ;;
              *)
                STATE=error
                DESCRIPTION="Actions cancelled; SSM outcome could not be confirmed"
                ;;
            esac
          else
            STATE=failure
            DESCRIPTION="EC2 deployment failed; inspect the Actions run"
          fi
          jq -nc --arg state "$STATE" --arg description "$DESCRIPTION" \
            --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, log_url: $log_url, description: $description}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - >/dev/null
